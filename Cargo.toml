[package]
name = "token-sentinel"
version = "0.1.0"
edition = "2021"
authors = ["markankamaransheogarat-sys <markankamaransheogarat@users.noreply.github.com>"]
description = "Local Context Budget Guardian, Deduplication Proxy & Phantom Package Hallucination Scanner for AI Coding Agents in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markankamaransheogarat-sys/token-sentinel"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"

[dev-dependencies]
tokio-test = "0.4"
